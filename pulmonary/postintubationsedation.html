```html
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-Intubation Sedation Helper</title>
<style>
  body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
    padding:20px;
    color:#111827;
  }

  .container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }

  h1{
    margin-top:0;
    font-size:1.4rem;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  @media(max-width:700px){
    .grid{
      grid-template-columns:1fr;
    }
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  label{
    font-size:0.85rem;
    font-weight:600;
  }

  input,select{
    padding:8px;
    border-radius:8px;
    border:1px solid #d1d5db;
    font-size:0.9rem;
  }

  button{
    margin-top:16px;
    width:100%;
    border:none;
    background:#0f766e;
    color:white;
    padding:10px;
    border-radius:10px;
    font-size:0.95rem;
    cursor:pointer;
  }

  .result{
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
  }

  .section{
    margin-bottom:14px;
  }

  .title{
    font-weight:700;
    margin-bottom:5px;
    color:#0f766e;
  }

  .warn{
    color:#b91c1c;
    font-weight:600;
  }

  ul{
    margin:6px 0;
    padding-left:18px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Post-Intubation Sedation Helper</h1>

  <div class="grid">
    <div class="field">
      <label>Weight (kg)</label>
      <input id="weight" type="number">
    </div>

    <div class="field">
      <label>Hemodynamics</label>
      <select id="hemo">
        <option value="stable">Stable / Hypertensive</option>
        <option value="borderline">Borderline BP</option>
        <option value="shock">Shock / Hypotensive</option>
      </select>
    </div>

    <div class="field">
      <label>Bronchospasm / Severe Asthma?</label>
      <select id="bronchospasm">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </div>

    <div class="field">
      <label>Need Deep Sedation?</label>
      <select id="deep">
        <option value="no">No</option>
        <option value="yes">Yes</option>
      </select>
    </div>
  </div>

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="result">
    Enter patient information and click calculate.
  </div>
</div>

<script>
function calculate(){
  const wt = parseFloat(document.getElementById('weight').value);
  const hemo = document.getElementById('hemo').value;
  const bronch = document.getElementById('bronchospasm').value;
  const deep = document.getElementById('deep').value;

  const result = document.getElementById('result');

  if(!wt){
    result.innerHTML = '<span class="warn">Please enter weight.</span>';
    return;
  }

  let sedative = '';
  let sedDose = '';
  let analgesic = '';
  let analDose = '';
  let bolus = '';
  let warnings = [];

  // Sedation choice
  if(hemo === 'shock'){
    if(bronch === 'yes'){
      sedative = 'Ketamine infusion';
      sedDose = '0.5–2 mg/kg/hr';
    }else{
      sedative = 'Midazolam infusion';
      sedDose = '2–10 mg/hr';
    }

    warnings.push('Avoid aggressive propofol dosing in hypotension/shock.');
  }
  else if(deep === 'yes'){
    sedative = 'Propofol infusion';
    sedDose = '20–80 mcg/kg/min';
  }
  else {
    sedative = 'Light propofol or dexmedetomidine strategy';
    sedDose = 'Propofol 10–40 mcg/kg/min';
  }

  // Analgesia
  analgesic = 'Fentanyl infusion';
  analDose = '25–200 mcg/hr';
  bolus = (wt * 1).toFixed(0) + ' mcg IV bolus if needed';

  // Warnings
  if(hemo === 'shock'){
    warnings.push('Monitor closely for peri-intubation hypotension.');
  }

  if(deep === 'yes'){
    warnings.push('Reassess sedation goals daily to avoid oversedation.');
  }

  result.innerHTML = `
    <div class="section">
      <div class="title">Sedation Strategy</div>
      <ul>
        <li><strong>${sedative}</strong></li>
        <li>Suggested dosing: ${sedDose}</li>
      </ul>
    </div>

    <div class="section">
      <div class="title">Analgesia</div>
      <ul>
        <li><strong>${analgesic}</strong></li>
        <li>Infusion: ${analDose}</li>
        <li>Bolus: ${bolus}</li>
      </ul>
    </div>

    <div class="section">
      <div class="title">Reminders</div>
      <ul>
        <li>Analgesia should accompany sedation.</li>
        <li>Titrate to RASS goal.</li>
        <li>Assess for hypotension after sedation initiation.</li>
        ${warnings.map(w => `<li class="warn">${w}</li>`).join('')}
      </ul>
    </div>
  `;
}
</script>

</body>
</html>
```
